<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;300;400;600;700&display=swap"
    rel="stylesheet" />
  <link href="dist/css/style.css" rel="stylesheet" />
  <script type="module" src="dist/js/components/mm-burningship.js"></script>
  <script type="module" src="dist/js/components/ui-elements/side-bar.js"></script>
  <script type="module" src="dist/js/burning-ship.js"></script>
  <script type="module" src="dist/js/utils/title-card.js"></script>
  <title>Burning Ship - Markup Monks</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B0BEV3T4NK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-B0BEV3T4NK');
  </script>
</head>

<body>
  <div class="content" data-content>
    <side-bar></side-bar>
    <section class="fractals">
      <header class="fractals__header fractals__header--full-view" data-title-card>
        <button type="button" class="title-card__close" data-close-title aria-label="Close title">&times;</button>
        <h1 class="fractals__main-header">Burning Ship</h1>
        <h5 class="fractals__sub-header">
          Infinite Descent
        </h5>
        <p class="intro__details code">
          One absolute value, taken on the cross term of z&sup2;, turns the
          Mandelbrot set's smooth bulbs into flame, mountain, and coral-like
          silhouettes. Press Descend and fall into it.
        </p>
      </header>
      <button type="button" class="title-card__open" data-open-title></button>
      <div class="burningship-canvas">
        <mm-burningship data-burningship-el></mm-burningship>
      </div>
      <div class="burningship-controls collapsed" data-burningship-controls>
        <button type="button" class="burningship-controls__close" data-close-controls aria-label="Close toolbar">&times;</button>
        <div class="burningship-controls__group">
          <label>
            Iterations:
            <input type="range" min="50" max="600" value="100" step="10" data-iterations>
            <span class="burningship-controls__value" data-iterations-value>100</span>
          </label>
          <label>
            Palette:
            <select data-palette>
              <option value="0">Ember</option>
              <option value="1">Glacier</option>
              <option value="2">Coral</option>
              <option value="3">Obsidian</option>
            </select>
          </label>
        </div>
        <div class="burningship-controls__group">
          <label>
            Descent Speed:
            <input type="range" min="0.2" max="4" value="1" step="0.1" data-descend-speed>
            <span class="burningship-controls__value" data-descend-speed-value>1.0x</span>
          </label>
        </div>
        <div class="burningship-controls__buttons">
          <button type="button" class="burningship-controls__play-pause" data-descend>Descend</button>
          <button type="button" class="burningship-controls__play-pause" data-reset-view>Reset View</button>
        </div>
      </div>
      <button type="button" class="burningship-controls__open visible" data-open-controls>Open Toolbar</button>
    </section>
  </div>
  <style>
    .burningship-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
    }
    .burningship-canvas mm-burningship {
      display: block;
      width: 100%;
      height: 100%;
    }
    .burningship-controls {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 16px;
      border-radius: 24px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 460px;
      text-align: center;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .burningship-controls.collapsed {
      opacity: 0;
      transform: translateX(-50%) scale(0.85) translateY(10px);
      pointer-events: none;
    }
    .burningship-controls__close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      color: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .burningship-controls__close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .burningship-controls__open {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 10px 22px;
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      font: inherit;
      cursor: pointer;
      opacity: 0;
      transform: translateX(-50%) scale(0.85);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .burningship-controls__open.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }
    .burningship-controls__open:hover {
      background: rgba(20, 20, 24, 0.3);
    }
    .burningship-controls__group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
      width: 100%;
    }
    .burningship-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 14px;
    }
    .burningship-controls input[type="range"] {
      accent-color: rgba(255, 255, 255, 0.85);
    }
    .burningship-controls select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-size: 13px;
      padding: 4px 8px;
    }
    .burningship-controls select option {
      color: #000;
    }
    .burningship-controls__value {
      min-width: 3.5em;
      display: inline-block;
    }
    .burningship-controls__buttons {
      display: flex;
      gap: 10px;
    }
    .burningship-controls__play-pause {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      color: inherit;
      font: inherit;
      font-size: 14px;
      padding: 6px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .burningship-controls__play-pause:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    @media (max-width: 600px) {
      .burningship-controls {
        width: 95%;
        bottom: 20px;
        padding: 12px;
        border-radius: 20px;
      }
      .burningship-controls__group {
        flex-direction: column;
        align-items: center;
      }
      .burningship-controls__open {
        bottom: 20px;
      }
    }
  </style>
</body>

</html>
