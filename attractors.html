<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;300;400;600;700&display=swap"
    rel="stylesheet" />
  <link href="dist/css/style.css" rel="stylesheet" />
  <script type="module" src="dist/js/components/mm-attractor.js"></script>
  <script type="module" src="dist/js/components/ui-elements/side-bar.js"></script>
  <script type="module" src="dist/js/attractors.js"></script>
  <script type="module" src="dist/js/utils/title-card.js"></script>
  <title>Strange Attractors - Markup Monks</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B0BEV3T4NK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-B0BEV3T4NK');
  </script>
</head>

<body>
  <div class="content" data-content>
    <side-bar></side-bar>
    <section class="fractals">
      <header class="fractals__header fractals__header--full-view" data-title-card>
        <button type="button" class="title-card__close" data-close-title aria-label="Close title">&times;</button>
        <h1 class="fractals__main-header">Strange Attractors</h1>
        <h5 class="fractals__sub-header">
          Clifford &amp; Peter de Jong maps
        </h5>
        <p class="intro__details code">
          Four numbers, a chaotic orbit iterated millions of times, and a
          density histogram in place of a pixel-by-pixel formula. Press
          Randomize - thousands of compositions live in this tiny system.
        </p>
      </header>
      <button type="button" class="title-card__open" data-open-title></button>
      <div class="attractor-canvas">
        <mm-attractor data-attractor-el></mm-attractor>
      </div>
      <div class="attractor-controls collapsed" data-attractor-controls>
        <button type="button" class="attractor-controls__close" data-close-controls aria-label="Close toolbar">&times;</button>
        <div class="attractor-controls__group">
          <label>
            Type:
            <select data-type>
              <option value="clifford">Clifford</option>
              <option value="dejong">Peter de Jong</option>
            </select>
          </label>
          <label>
            Palette:
            <select data-palette>
              <option value="0">Mono</option>
              <option value="1">Ember</option>
              <option value="2">Neon</option>
              <option value="3">Aurora</option>
            </select>
          </label>
        </div>
        <div class="attractor-controls__group">
          <label>
            a:
            <input type="range" min="-3" max="3" value="-1.4" step="0.001" data-a>
            <span class="attractor-controls__value" data-a-value>-1.400</span>
          </label>
          <label>
            b:
            <input type="range" min="-3" max="3" value="1.6" step="0.001" data-b>
            <span class="attractor-controls__value" data-b-value>1.600</span>
          </label>
        </div>
        <div class="attractor-controls__group">
          <label>
            c:
            <input type="range" min="-3" max="3" value="1.0" step="0.001" data-c>
            <span class="attractor-controls__value" data-c-value>1.000</span>
          </label>
          <label>
            d:
            <input type="range" min="-3" max="3" value="0.7" step="0.001" data-d>
            <span class="attractor-controls__value" data-d-value>0.700</span>
          </label>
        </div>
        <div class="attractor-controls__group">
          <label>
            <input type="checkbox" data-drift-toggle checked>
            Organic Drift
          </label>
          <label>
            Drift Speed:
            <input type="range" min="0" max="5" value="1" step="0.1" data-drift-speed>
            <span class="attractor-controls__value" data-drift-speed-value>1.0x</span>
          </label>
        </div>
        <div class="attractor-controls__buttons">
          <button type="button" class="attractor-controls__randomize" data-randomize>Randomize</button>
        </div>
      </div>
      <button type="button" class="attractor-controls__open visible" data-open-controls>Open Toolbar</button>
    </section>
  </div>
  <style>
    .attractor-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
    }
    .attractor-canvas mm-attractor {
      display: block;
      width: 100%;
      height: 100%;
    }
    .attractor-controls {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 16px;
      border-radius: 24px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .attractor-controls.collapsed {
      opacity: 0;
      transform: translateX(-50%) scale(0.85) translateY(10px);
      pointer-events: none;
    }
    .attractor-controls__close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      color: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .attractor-controls__close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .attractor-controls__open {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 10px 22px;
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      font: inherit;
      cursor: pointer;
      opacity: 0;
      transform: translateX(-50%) scale(0.85);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .attractor-controls__open.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }
    .attractor-controls__open:hover {
      background: rgba(20, 20, 24, 0.3);
    }
    .attractor-controls__group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
      width: 100%;
    }
    .attractor-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 14px;
    }
    .attractor-controls input[type="range"],
    .attractor-controls input[type="checkbox"] {
      accent-color: rgba(255, 255, 255, 0.85);
    }
    .attractor-controls select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-size: 13px;
      padding: 4px 8px;
    }
    .attractor-controls select option {
      color: #000;
    }
    .attractor-controls__value {
      min-width: 4.5em;
      display: inline-block;
    }
    .attractor-controls__buttons {
      display: flex;
      gap: 10px;
    }
    .attractor-controls__randomize {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 14px;
      color: inherit;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 28px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .attractor-controls__randomize:hover {
      background: rgba(255, 255, 255, 0.26);
    }
    @media (max-width: 600px) {
      .attractor-controls {
        width: 95%;
        bottom: 20px;
        padding: 12px;
        border-radius: 20px;
      }
      .attractor-controls__group {
        flex-direction: column;
        align-items: center;
      }
      .attractor-controls__open {
        bottom: 20px;
      }
    }
  </style>
</body>

</html>
