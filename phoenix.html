  <title>Phoenix Fractal - Markup Monks</title>

<body>
  <div class="content" data-content>
    <side-bar></side-bar>
    <section class="fractals">
      <header class="fractals__header fractals__header--full-view" data-title-card>
        <button type="button" class="title-card__close" data-close-title aria-label="Close title">&times;</button>
        <h1 class="fractals__main-header">Phoenix Fractal</h1>
        <h5 class="fractals__sub-header">
          Web component for the Phoenix fractal
        </h5>
        <p class="intro__details code">
          Usage:
          <code>&lt;mm-phoenix&gt;&lt;/mm-phoenix&gt;
          </code>
        </p>
      </header>
      <button type="button" class="title-card__open" data-open-title></button>
      <div class="phoenix-canvas">
        <mm-phoenix data-phoenix-el></mm-phoenix>
      </div>
      <div class="phoenix-controls collapsed" data-phoenix-controls>
        <button type="button" class="phoenix-controls__close" data-close-controls aria-label="Close toolbar">&times;</button>
        <div class="phoenix-controls__group">
          <label>
            c (real):
            <input type="range" min="-2" max="2" value="0.5667" step="0.001" data-c-real>
            <span class="phoenix-controls__value" data-c-real-value>0.567</span>
          </label>
          <label>
            c (imag):
            <input type="range" min="-2" max="2" value="0" step="0.001" data-c-imag>
            <span class="phoenix-controls__value" data-c-imag-value>0.000</span>
          </label>
        </div>
        <div class="phoenix-controls__group">
          <label>
            p (real):
            <input type="range" min="-1.5" max="1.5" value="-0.5" step="0.001" data-p-real>
            <span class="phoenix-controls__value" data-p-real-value>-0.500</span>
          </label>
          <label>
            p (imag):
            <input type="range" min="-1.5" max="1.5" value="0" step="0.001" data-p-imag>
            <span class="phoenix-controls__value" data-p-imag-value>0.000</span>
          </label>
        </div>
        <div class="phoenix-controls__group">
          <label>
            Iterations:
            <input type="range" min="20" max="400" value="150" step="10" data-iterations>
            <span class="phoenix-controls__value" data-iterations-value>150</span>
          </label>
          <label>
            Escape Radius:
            <input type="range" min="2" max="20" value="4" step="0.5" data-escape-radius>
            <span class="phoenix-controls__value" data-escape-radius-value>4</span>
          </label>
          <label>
            Symmetry:
            <input type="range" min="1" max="8" value="1" step="1" data-symmetry>
            <span class="phoenix-controls__value" data-symmetry-value>1</span>
          </label>
          <label>
            Rotation:
            <input type="range" min="-180" max="180" value="90" step="1" data-rotation>
            <span class="phoenix-controls__value" data-rotation-value>90&deg;</span>
          </label>
        </div>
        <div class="phoenix-controls__group">
          <label>
            Palette:
            <select data-palette>
              <option value="0">Classic</option>
              <option value="1">Ember</option>
              <option value="2">Ocean</option>
              <option value="3">Aurora</option>
            </select>
          </label>
          <label>
            <input type="checkbox" data-drift-toggle checked>
            Organic Drift
          </label>
          <label>
            Drift Speed:
            <input type="range" min="0" max="5" value="1" step="0.1" data-drift-speed>
            <span class="phoenix-controls__value" data-drift-speed-value>1.0x</span>
          </label>
        </div>
        <div class="phoenix-controls__buttons">
          <button type="button" class="phoenix-controls__play-pause" data-reset-view>Reset View</button>
        </div>
      </div>
      <button type="button" class="phoenix-controls__open visible" data-open-controls>Open Toolbar</button>
    </section>
  </div>
  <style>
    .phoenix-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
    }
    .phoenix-canvas mm-phoenix {
      display: block;
      width: 100%;
      height: 100%;
    }
    .phoenix-controls {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 16px;
      border-radius: 24px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 92%;
      max-width: 620px;
      text-align: center;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .phoenix-controls.collapsed {
      opacity: 0;
      transform: translateX(-50%) scale(0.85) translateY(10px);
      pointer-events: none;
    }
    .phoenix-controls__close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      color: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .phoenix-controls__close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .phoenix-controls__open {
      position: fixed;
      z-index: 99;
      bottom: 10px;
      left: 50%;
      background: rgba(20, 20, 24, 0.16);
      backdrop-filter: blur(2px) saturate(165%);
      -webkit-backdrop-filter: blur(2px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 10px 22px;
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.35);
      font: inherit;
      cursor: pointer;
      opacity: 0;
      transform: translateX(-50%) scale(0.85);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: bottom center;
    }
    .phoenix-controls__open.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }
    .phoenix-controls__open:hover {
      background: rgba(20, 20, 24, 0.3);
    }
    .phoenix-controls__group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
      width: 100%;
    }
    .phoenix-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 14px;
    }
    .phoenix-controls input[type="range"],
    .phoenix-controls input[type="checkbox"] {
      accent-color: rgba(255, 255, 255, 0.85);
    }
    .phoenix-controls select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-size: 13px;
      padding: 4px 8px;
    }
    .phoenix-controls select option {
      color: #000;
    }
    .phoenix-controls__value {
      min-width: 3.5em;
      display: inline-block;
    }
    .phoenix-controls__buttons {
      display: flex;
      gap: 10px;
    }
    .phoenix-controls__play-pause {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      color: inherit;
      font: inherit;
      font-size: 14px;
      padding: 6px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .phoenix-controls__play-pause:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    @media (max-width: 600px) {
      .phoenix-controls {
        width: 95%;
        bottom: 20px;
        padding: 12px;
        border-radius: 20px;
      }
      .phoenix-controls__group {
        flex-direction: column;
        align-items: center;
      }
      .phoenix-controls__open {
        bottom: 20px;
      }
    }
  </style>
</body>

</html>
